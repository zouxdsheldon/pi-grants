name: Pivot data reminder (every 2 weeks)

on:
  schedule:
    # GitHub cron has no native "every 2 weeks"; the 1st and 15th ≈ bi-weekly.
    - cron: '0 13 1,15 * *'   # 13:00 UTC on the 1st & 15th
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # Opens a GitHub Issue assigned to whoever owns the fork — zero setup,
      # GitHub emails the assignee. No SMTP secrets, no hardcoded addresses.
      - name: Open reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            const body = [
              '## ⏰ Pivot-RP 数据更新提醒',
              '',
              '距离上次更新已约 2 周。若你有机构订阅的 Pivot-RP,可刷新一次精选资助数据:',
              '',
              '**手动更新步骤(约 5 分钟):**',
              '1. 登录本机构的 Pivot-RP,用保存的检索式导出最新 CSV',
              '2. 运行 `python3 scripts/import_pivot.py <导出的csv>` 合并进 `data/curated.json`',
              '3. `git add data/curated.json && git commit && git push` → Pages 自动重新部署',
              '',
              '政府类 grant(`data/grants.json`)、文献(`data/papers.json`)已由 `update.yml`',
              '每日自动刷新,无需手动。没有 Pivot 订阅的话,这一步可以直接跳过 ——',
              '网站的联邦数据源与文献追踪都不依赖它。',
              '',
              '> 关掉此提醒:在 Actions 里 disable `Pivot data reminder` 工作流。',
              '',
              `_自动生成于 ${today}_`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⏰ 更新 Pivot 数据 — ${today}`,
              body,
              assignees: [context.repo.owner]
            });
