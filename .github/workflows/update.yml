name: Update grants data

on:
  schedule:
    - cron: '0 11 * * *'      # daily at 11:00 UTC (~07:00 US Eastern)
  workflow_dispatch: {}        # allow manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest grants
        run: python scripts/fetch_grants.py
      - name: Fetch academic jobs
        run: python scripts/fetch_jobs.py || echo "jobs fetch failed, keeping previous data/jobs.json"
      - name: Import Pivot CSV drops (data/pivot_inbox/*.csv)
        # 你把 Pivot 导出的 CSV 提交进 data/pivot_inbox/,这一步自动并入
        # curated.json 并删掉已消费的文件。空目录时它什么也不做。
        run: python scripts/import_pivot.py data/pivot_inbox --consume
      - name: Rebuild calendar feed (.ics)
        run: python scripts/build_ics.py
      - name: Import research-direction drops (data/interests_inbox/*.json)
        # 网页「我的研究方向」面板导出的 interests.json 放进 data/interests_inbox/,
        # 这一步把它并入 data/interests.json 并删掉已消费的文件。空目录时什么也不做。
        # 必须排在文献抓取**之前** —— 否则新方向要等到第二天才生效。
        # 校验不通过时脚本非零退出、不改任何文件;这里不加 `|| true`,
        # 因为静默跳过会让用户以为换库成功了,而实际上还在按旧方向抓。
        run: python scripts/import_interests.py data/interests_inbox --consume
      - name: Fetch literature (6 sources) + accumulate citation snapshot
        env:
          PAPER_WINDOW_DAYS: '400'
          PAPER_MAX_PER_SOURCE: '150'
        run: python scripts/fetch_papers.py || echo "papers fetch failed, keeping previous data/papers.json"
      - name: Analyze literature (abstract sections / methods / phrases / novelty)
        run: python scripts/analyze_papers.py || echo "analysis failed, papers.json keeps previous analysis fields"
      - name: Build in-corpus citation network
        # limit 900 覆盖语料里全部约 670 篇有 PMID 的记录(实测约 185s);
        # 有全局墙钟预算,连接挂起时会写出已抓部分而不是把整轮定时任务拖死
        run: python scripts/fetch_citenet.py --limit 900 --budget 1500 || echo "citenet failed, keeping previous data/citenet.json"
      - name: Rebuild journal library (corpus-scoped, no impact factors)
        run: python scripts/build_journals.py || echo "journal build failed, keeping previous data/journals.json"
      - name: Front-end behaviour tests (deep-read panel, all real records)
        run: python tests/run_ui_tests.py || echo "UI tests failed — data still published, check the log"
      - name: Portal / global search / journal panel tests
        run: python tests/run_portal_tests.py || echo "portal tests failed — data still published, check the log"
      - name: Build daily digest page + RSS feed
        run: python scripts/build_digest.py || echo "digest build skipped"
      - name: Commit if changed
        run: |
          git config user.name  "grants-bot"
          git config user.email "grants-bot@users.noreply.github.com"
          # journals.json 必须一起提交:它是从 papers.json 重算的,漏掉它
          # 会让期刊面板长期停留在旧计数(2026-08 发现的真实 bug)。
          git add data/grants.json data/grant_deadlines.ics data/jobs.json \
                  data/curated.json data/pivot_inbox \
                  data/interests.json data/interests_inbox \
                  data/papers.json data/citation_snapshots.json \
                  data/citenet.json data/journals.json \
                  data/fetch_log_papers.json data/digest.json \
                  digest.html feed.xml
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update grants data ($(date -u +%Y-%m-%d))"
            git push
          fi
